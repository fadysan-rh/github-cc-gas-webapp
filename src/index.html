<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAS Web App Skeleton</title>
  <!-- MUI fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- MUI (UMD build) -->
  <script crossorigin src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js"></script>
  <!-- Babel (standalone for JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      Container,
      Typography,
      Button,
      Snackbar,
      Alert,
      ThemeProvider,
      createTheme,
      CssBaseline,
      Box,
    } = MaterialUI;

    const lightTheme = createTheme({
      palette: {
        mode: 'light',
        primary: { main: '#1976d2' },
        background: { default: '#f5f5f5', paper: '#ffffff' },
      },
    });

    function App() {
      const [snackOpen, setSnackOpen] = React.useState(false);
      const [snackMsg, setSnackMsg]   = React.useState('');
      const [loading, setLoading]     = React.useState(false);

      function handleTest() {
        setLoading(true);
        google.script.run
          .withSuccessHandler((result) => {
            setSnackMsg(result);
            setSnackOpen(true);
            setLoading(false);
          })
          .withFailureHandler((err) => {
            setSnackMsg('Error: ' + err.message);
            setSnackOpen(true);
            setLoading(false);
          })
          .hello();
      }

      return (
        <ThemeProvider theme={lightTheme}>
          <CssBaseline />
          <Container maxWidth="sm">
            <Box
              sx={{
                minHeight: '100vh',
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                justifyContent: 'center',
                gap: 4,
              }}
            >
              <Box
                sx={{
                  bgcolor: 'background.paper',
                  borderRadius: 3,
                  boxShadow: 2,
                  px: 6,
                  py: 5,
                  display: 'flex',
                  flexDirection: 'column',
                  alignItems: 'center',
                  gap: 3,
                  width: '100%',
                }}
              >
                <Typography variant="h4" component="h1" fontWeight={700} textAlign="center" color="text.primary">
                  GAS Web App is alive
                </Typography>
                <Typography variant="body1" color="text.secondary" textAlign="center">
                  google.script.run の疎通を確認してください
                </Typography>
                <Button
                  variant="contained"
                  size="large"
                  onClick={handleTest}
                  disabled={loading}
                  sx={{ minWidth: 240 }}
                >
                  {loading ? 'Calling...' : 'Test google.script.run'}
                </Button>
              </Box>
            </Box>

            <Snackbar
              open={snackOpen}
              autoHideDuration={4000}
              onClose={() => setSnackOpen(false)}
              anchorOrigin={{ vertical: 'bottom', horizontal: 'center' }}
            >
              <Alert
                onClose={() => setSnackOpen(false)}
                severity="success"
                variant="filled"
                sx={{ width: '100%' }}
              >
                {snackMsg}
              </Alert>
            </Snackbar>
          </Container>
        </ThemeProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
